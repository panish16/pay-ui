name: PAY-UI CI

on:
  pull_request:
    branches:
      - main
      - feature*
    paths:
      - "**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  pay-ui-ci:
    uses: panish16/bcregistry-sre/.github/workflows/frontend-ci.yaml@feat/upgrade-pnpm-v11
    with:
      node_version: 24
      pnpm_version: latest-11
      app_name: "pay-ui"
      working_directory: "./web/pay-ui"
      codecov_flag: "payweb"
